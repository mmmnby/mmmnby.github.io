<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Ride Share</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #2c3e50; }
        .section { display: none; margin-top: 20px; }
        .active { display: block; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .log-box { background: #1e1e1e; color: #00ff00; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; border-radius: 4px; }
        .ride-request { border: 1px solid #e74c3c; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fdf2f0; }
    </style>
</head>
<body>

<div class="container">
    <h1>P2P Ride Share</h1>
    
    <!-- LOGIN SELECTION -->
    <div id="login-section" class="section active">
        <h2>Select Role</h2>
        <input type="text" id="fleet-id" placeholder="Enter Shared Fleet ID (e.g., 'city-fleet-123')">
        <button onclick="initApp('driver')">Login as Driver</button>
        <button onclick="initApp('rider')">Login as Rider</button>
    </div>

    <!-- RIDER UI -->
    <div id="rider-section" class="section">
        <h2>Rider Dashboard</h2>
        <p>Status: <span id="rider-status">Connecting...</span></p>
        <input type="text" id="origin" placeholder="Origin (e.g., 123 Main St)">
        <input type="text" id="destination" placeholder="Destination (e.g., 456 Market St)">
        <button onclick="requestRide()">Broadcast Ride Request</button>
        <h3>System Logs</h3>
        <div class="log-box" id="rider-log"></div>
    </div>

    <!-- DRIVER UI -->
    <div id="driver-section" class="section">
        <h2>Driver Dashboard</h2>
        <p>Status: <span id="driver-status">Connecting...</span></p>
        <h3>Incoming Requests (Auto-sorted)</h3>
        <div id="ride-queue"></div>
        <h3>System Logs</h3>
        <div class="log-box" id="driver-log"></div>
    </div>
</div>

<script>
    let peer = null;
    let connections = [];
    let role = '';
    let fleetId = '';
    let rideQueue = [];

    // Initialize the Application based on role
    function initApp(selectedRole) {
        fleetId = document.getElementById('fleet-id').value.trim();
        if (!fleetId) {
            alert('Please enter a Fleet ID to connect to the local P2P network.');
            return;
        }

        role = selectedRole;
        document.getElementById('login-section').classList.remove('active');
        document.getElementById(`${role}-section`).classList.add('active');

        setupPeer();
    }

    // Setup WebRTC PeerJS logic
    function setupPeer() {
        // Drivers create predictable IDs based on the Fleet ID for Riders to find them.
        // In a production app, a tracker would manage this. Here we use a pseudo-deterministic mesh.
        const peerId = role === 'driver' ? `${fleetId}-driver-${Math.floor(Math.random() * 1000)}` : null;
        
        peer = new Peer(peerId);

        peer.on('open', (id) => {
            logMsg(`Connected to P2P network. ID: ${id}`);
            updateStatus('Online & Ready');

            if (role === 'rider') {
                connectToFleetDrivers();
            }
        });

        // Driver handling incoming connections from Riders
        peer.on('connection', (conn) => {
            conn.on('open', () => {
                logMsg(`New rider connected: ${conn.peer}`);
                connections.push(conn);
            });

            conn.on('data', (data) => {
                if (data.type === 'ride_request') {
                    handleRideRequest(data.payload, conn);
                }
            });
        });

        peer.on('error', (err) => {
            logMsg(`Error: ${err.type}`);
            updateStatus('Error connecting.');
        });
    }

    // Riders proactively attempt to connect to drivers in the fleet
    function connectToFleetDrivers() {
        logMsg('Scanning for available drivers in fleet...');
        // Simplified discovery: Attempting to connect to potential driver IDs in the fleet pool.
        // A real tracker server is required for true peer discovery without guessing IDs.
        for (let i = 0; i < 1000; i++) {
            let targetDriverId = `${fleetId}-driver-${i}`;
            let conn = peer.connect(targetDriverId, { reliable: true });
            
            conn.on('open', () => {
                logMsg(`Successfully connected to driver: ${targetDriverId}`);
                connections.push(conn);
                updateStatus('Connected to Driver(s)');
            });
        }
    }

    // Rider Broadcasts Ride Request
    function requestRide() {
        const origin = document.getElementById('origin').value;
        const destination = document.getElementById('destination').value;

        if (!origin || !destination) {
            alert('Please enter origin and destination.');
            return;
        }

        const requestPayload = {
            id: Date.now(),
            origin: origin,
            destination: destination,
            timestamp: new Date().toLocaleTimeString()
        };

        if (connections.length === 0) {
            logMsg('No drivers found. Request stored locally.');
            localStorage.setItem('pendingRide', JSON.stringify(requestPayload));
            return;
        }

        // Broadcast to all connected drivers
        connections.forEach(conn => {
            conn.send({ type: 'ride_request', payload: requestPayload });
            logMsg(`Request broadcasted to ${conn.peer}`);
        });
    }

    // Driver processes and algorithmically sorts ride requests
    function handleRideRequest(request, conn) {
        logMsg(`Ride requested from ${conn.peer}`);
        
        // Add to queue
        rideQueue.push(request);
        
        // Algorithmic Sort: Currently sorting by time received (FIFO). 
        // To sort by distance, GPS coordinates (via navigator.geolocation) 
        // would be applied using the Haversine formula here.
        rideQueue.sort((a, b) => a.id - b.id);
        
        renderRideQueue();
    }

    // Render the driver's queue
    function renderRideQueue() {
        const queueContainer = document.getElementById('ride-queue');
        queueContainer.innerHTML = '';

        rideQueue.forEach(ride => {
            const div = document.createElement('div');
            div.className = 'ride-request';
            div.innerHTML = `
                <strong>Origin:</strong> ${ride.origin} <br>
                <strong>Destination:</strong> ${ride.destination} <br>
                <em>Requested at ${ride.timestamp}</em> <br>
                <button onclick="acceptRide(${ride.id})">Accept Ride</button>
            `;
            queueContainer.appendChild(div);
        });
    }

    function acceptRide(rideId) {
        rideQueue = rideQueue.filter(r => r.id !== rideId);
        renderRideQueue();
        logMsg(`Ride ${rideId} accepted. Routing...`);
        // Here, a message would be sent back to the specific rider peer acknowledging the ride.
    }

    // Utility functions for UI updates
    function logMsg(msg) {
        const logContainer = document.getElementById(`${role}-log`);
        logContainer.innerHTML += `> ${msg}<br>`;
        logContainer.scrollTop = logContainer.scrollHeight;
    }

    function updateStatus(status) {
        document.getElementById(`${role}-status`).innerText = status;
    }
</script>
</body>
</html>
