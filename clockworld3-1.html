<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Responsive 24-Hour World Timer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(to bottom, #e0f0ff, #a0d0ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }
    #clockCanvasElement { display: block; }
    #digitalClockElement, #localTimeContainer {
      margin-top: 0.5em;
      font-size: 1.1em;
      font-weight: 500;
      text-align: center;
      color: #333333;
    }
    #zoneButtonsContainer {
      margin-top: 10px;
    }
    #zoneButtonsContainer button {
      font-size: 1.2em;
      padding: 0.3em 0.8em;
      margin: 0 0.5em;
      cursor: pointer;
      border: 1px solid #999999;
      background: #ffffff;
      border-radius: 4px;
    }
    #timeZoneSliderElement {
      width: 90vw;
      max-width: 500px;
      height: 2em;
      margin: 1em auto;
      background: #dddddd;
      border-radius: 0.25em;
      touch-action: none;
      user-select: none;
      position: relative;
    }
    #timeZoneSliderElement::after {
      content: 'Swipe to change zone';
      position: absolute;
      width: 100%;
      text-align: center;
      line-height: 2em;
      color: #777777;
      font-size: 0.8em;
      pointer-events: none;
    }
    #timeZoneSliderElement:active { background: #cccccc; }
  </style>
</head>
<body>

  <canvas id="clockCanvasElement"></canvas>
  <div id="digitalClockElement"></div>
  <div id="localTimeContainer">
    <span id="localTimeDisplayElement"></span>
  </div>
  <div id="zoneButtonsContainer">
    <button id="decreaseZoneButton">←</button>
    <button id="increaseZoneButton">→</button>
  </div>
  <div id="timeZoneSliderElement"></div>

  <script>
    /* ==========================================================================
       1. CONSTANTS & CONFIGURATION
       ========================================================================== */
    const mathematicalPi = Math.PI;
    const doublePi = mathematicalPi * 2;
    const halfPi = mathematicalPi / 2;

    const radiusMultipliers = {
      outerTickRing: 0.97,
      staticNumbers: 0.86,
      redArrowOrbit: 0.8,
      magentaArrowOrbit: 0.925,
      worldMap: 0.495,
      hourNumberRing: 0.55575,
      cityLabelRing: 0.668,
      cityLabelStagger: 0.072
    };

    // Values increased by 10%
    const pointerConfiguration = {
      hourHand: {
        length: 31.9, 
        baseWidth: 11,
        tipWidth: 11,
        primaryColor: '#ff4d4d',
        secondaryColor: '#991900',
        shadowBlurAmount: 6.6
      },
      minuteHand: {
        length: 53.9,
        baseWidth: 13.2,
        tipWidth: 4.4,
        primaryColor: '#FF00FF',
        secondaryColor: '#D100D1',
        shadowBlurAmount: 4.4
      }
    };

    const globalTimeZones = [
      { cityName: 'Pago Pago',  timeDifference: -11 }, { cityName: 'Honolulu',   timeDifference: -10 },
      { cityName: 'Anchorage',  timeDifference:  -9 }, { cityName: 'Los Angeles',timeDifference:  -8 },
      { cityName: 'Denver',     timeDifference:  -7 }, { cityName: 'Mexico City',timeDifference:  -6 },
      { cityName: 'New York',   timeDifference:  -5 }, { cityName: 'Santiago',   timeDifference:  -4 },
      { cityName: 'Buenos Air', timeDifference:  -3 }, { cityName: 'Ponta Del',  timeDifference:  -2 },
      { cityName: 'Azores',     timeDifference:  -1 }, { cityName: 'London',     timeDifference:   0 },
      { cityName: 'Berlin',     timeDifference:  +1 }, { cityName: 'Cairo',      timeDifference:  +2 },
      { cityName: 'Moscow',     timeDifference:  +3 }, { cityName: 'Dubai',      timeDifference:  +4 },
      { cityName: 'Karachi',    timeDifference:  +5 }, { cityName: 'Dhaka',      timeDifference:  +6 },
      { cityName: 'Bangkok',    timeDifference:  +7 }, { cityName: 'Beijing',    timeDifference:  +8 },
      { cityName: 'Tokyo',      timeDifference:  +9 }, { cityName: 'Sydney',     timeDifference: +10 },
      { cityName: 'Noumea',     timeDifference: +11 }, { cityName: 'Auckland',   timeDifference: +12 }
    ];

    /* ==========================================================================
       2. STATE & DOM ELEMENTS
       ========================================================================== */
    const clockCanvasElement = document.getElementById('clockCanvasElement');
    const canvasContext = clockCanvasElement.getContext('2d');
    const digitalClockElement = document.getElementById('digitalClockElement');
    const localTimeDisplayElement = document.getElementById('localTimeDisplayElement');
    const increaseZoneButton = document.getElementById('increaseZoneButton');
    const decreaseZoneButton = document.getElementById('decreaseZoneButton');
    const timeZoneSliderElement = document.getElementById('timeZoneSliderElement');

    const worldMapImage = new Image();
    worldMapImage.src = 'worldmap.jpg'; 
    worldMapImage.onload = handleWindowResize;

    const defaultStartingTimeDifference = -8;
    let currentZoneIndex = globalTimeZones.findIndex(zone => zone.timeDifference === defaultStartingTimeDifference);
    if (currentZoneIndex < 0) currentZoneIndex = 11; 

    let touchStartingXCoordinate = 0;

    /* ==========================================================================
       3. MATHEMATICAL & TIME HELPERS
       ========================================================================== */
    function calculateHourAngle() {
      const currentDate = new Date();
      const universalTimeHour = currentDate.getUTCHours();
      const universalTimeMinute = currentDate.getUTCMinutes();
      const universalTimeSecond = currentDate.getUTCSeconds();
      
      const currentTimeDifference = globalTimeZones[currentZoneIndex].timeDifference;
      let localHoursDecimal = universalTimeHour + currentTimeDifference + (universalTimeMinute / 60) + (universalTimeSecond / 3600);
      
      localHoursDecimal = localHoursDecimal % 24;
      if (localHoursDecimal < 0) localHoursDecimal += 24;

      return ((localHoursDecimal - 12) * mathematicalPi / 12) - halfPi;
    }

    function calculateMinuteAngle() {
      const currentDate = new Date();
      const minutesDecimal = currentDate.getMinutes() + (currentDate.getSeconds() / 60);
      return (minutesDecimal * mathematicalPi / 30) - halfPi;
    }

    function formatTimeDifferenceText(timeDifference) {
      const signCharacter = timeDifference >= 0 ? '+' : '−';
      return `UTC${signCharacter}${Math.abs(timeDifference)}`;
    }

    function formatNumberWithLeadingZero(numberValue) {
      return String(numberValue).padStart(2, '0');
    }

    /* ==========================================================================
       4. DRAWING FUNCTIONS (CANVAS)
       ========================================================================== */
    function renderClockFace() {
      const canvasWidth = parseFloat(clockCanvasElement.style.width);
      const universalRadius = canvasWidth / 2;
      
      canvasContext.clearRect(0, 0, canvasWidth, canvasWidth);
      canvasContext.save();
      canvasContext.translate(universalRadius, universalRadius);

      drawWorldMapBackground(universalRadius);
      drawClockBorder(universalRadius * radiusMultipliers.worldMap);
      drawOuterTickRing(universalRadius * radiusMultipliers.outerTickRing);
      drawOuterStaticNumberRing(universalRadius * radiusMultipliers.staticNumbers);
      drawHourNumbersAndCities(universalRadius);
      
      drawTrapezoidPointer(
        radiusMultipliers.magentaArrowOrbit * universalRadius, 
        calculateMinuteAngle(), 
        pointerConfiguration.minuteHand
      );
      
      drawTrapezoidPointer(
        radiusMultipliers.redArrowOrbit * universalRadius, 
        calculateHourAngle(), 
        pointerConfiguration.hourHand
      );
      
      canvasContext.restore();
    }

    function drawWorldMapBackground(universalRadius) {
      const mapRadius = universalRadius * radiusMultipliers.worldMap;
      canvasContext.save();
      canvasContext.beginPath();
      canvasContext.arc(0, 0, mapRadius, 0, doublePi);
      canvasContext.clip();
      canvasContext.rotate(mathematicalPi);
      
      if (worldMapImage.complete && worldMapImage.naturalWidth > 0) {
        canvasContext.drawImage(worldMapImage, -mapRadius, -mapRadius, mapRadius * 2, mapRadius * 2);
      } else {
        canvasContext.fillStyle = '#a0d0ff';
        canvasContext.fill();
      }
      canvasContext.restore();
    }

    function drawTrapezoidPointer(orbitRadius, rotationalAngle, pointerStyle) {
      canvasContext.save();
      canvasContext.rotate(rotationalAngle);
      canvasContext.translate(orbitRadius, 0); 

      const linearGradient = canvasContext.createLinearGradient(0, 0, -pointerStyle.length, 0);
      linearGradient.addColorStop(0, pointerStyle.primaryColor); 
      linearGradient.addColorStop(1, pointerStyle.secondaryColor); 

      canvasContext.beginPath();
      canvasContext.moveTo(0, -pointerStyle.tipWidth / 2);                      
      canvasContext.lineTo(0, pointerStyle.tipWidth / 2);  
      canvasContext.lineTo(-pointerStyle.length, pointerStyle.baseWidth / 2); 
      canvasContext.lineTo(-pointerStyle.length, -pointerStyle.baseWidth / 2);  
      canvasContext.closePath();

      canvasContext.shadowBlur = pointerStyle.shadowBlurAmount;
      canvasContext.shadowColor = 'rgba(0, 0, 0, 0.4)';
      canvasContext.fillStyle = linearGradient;
      canvasContext.fill();

      canvasContext.shadowBlur = 0; 
      canvasContext.strokeStyle = '#ffffff';
      canvasContext.lineWidth = 1.65; // Proportional 10% increase
      canvasContext.stroke();
      
      canvasContext.restore();
    }

    function drawClockBorder(innerRadius) {
      canvasContext.beginPath();
      canvasContext.arc(0, 0, innerRadius, 0, doublePi);
      canvasContext.lineWidth = 2.2; // Proportional 10% increase
      canvasContext.strokeStyle = '#333333';
      canvasContext.stroke();
    }

    function drawOuterTickRing(specificRadius) {
      canvasContext.beginPath();
      canvasContext.arc(0, 0, specificRadius, 0, doublePi);
      canvasContext.lineWidth = 3.85; // Proportional 10% increase
      canvasContext.strokeStyle = '#666666';
      canvasContext.stroke();

      for (let iterationIndex = 0; iterationIndex < 60; iterationIndex++) {
        const rotationalAngle = (iterationIndex * mathematicalPi / 30) - halfPi;
        const majorTickLength = specificRadius * 0.06;
        const minorTickLength = majorTickLength * 0.66;
        const isMajorTick = (iterationIndex % 5 === 0);
        const currentTickLength = isMajorTick ? majorTickLength : minorTickLength;

        canvasContext.beginPath();
        canvasContext.moveTo(specificRadius * Math.cos(rotationalAngle), specificRadius * Math.sin(rotationalAngle));
        canvasContext.lineTo(
          (specificRadius - currentTickLength) * Math.cos(rotationalAngle), 
          (specificRadius - currentTickLength) * Math.sin(rotationalAngle)
        );
        canvasContext.lineWidth = isMajorTick ? 2.75 : 1.32; // Proportional 10% increase
        canvasContext.strokeStyle = isMajorTick ? '#333333' : '#888888';
        canvasContext.stroke();
      }
    }

    function drawOuterStaticNumberRing(specificRadius) {
      const textFontSize = specificRadius * 0.11; 
      canvasContext.font = `bold ${textFontSize}px sans-serif`;
      canvasContext.textAlign = 'center';
      canvasContext.textBaseline = 'middle';
      canvasContext.fillStyle = '#444444';

      for (let hourValue = 0; hourValue < 24; hourValue++) {
        const rotationalAngle = (hourValue * mathematicalPi / 12) + halfPi;
        const horizontalPosition = specificRadius * Math.cos(rotationalAngle);
        const verticalPosition = specificRadius * Math.sin(rotationalAngle);

        canvasContext.save();
        canvasContext.translate(horizontalPosition, verticalPosition);
        
        if (hourValue >= 6 && hourValue <= 18) canvasContext.rotate(rotationalAngle + halfPi);
        else canvasContext.rotate(rotationalAngle - halfPi);
        
        canvasContext.fillText(hourValue, 0, 0);
        canvasContext.restore();
      }
    }
    
    function drawHourNumbersAndCities(universalRadius) {
      const numberRingRadius = universalRadius * radiusMultipliers.hourNumberRing;
      const cityRingRadius   = universalRadius * radiusMultipliers.cityLabelRing;
      const outerReferenceRadius = universalRadius * radiusMultipliers.outerTickRing;
      
      const numberFontSize = outerReferenceRadius * 0.065;
      const cityFontSize = outerReferenceRadius * 0.060;
      const backgroundThickness = numberFontSize * 1.80;

      const currentDate = new Date();
      const currentUniversalHour = currentDate.getUTCHours(); 

      // Draw Number Ring Background
      canvasContext.save();
      canvasContext.lineWidth = backgroundThickness;
      for (let hourValue = 0; hourValue < 24; hourValue++) {
        const rotationalAngle = ((currentUniversalHour - hourValue) * mathematicalPi / 12) + halfPi;
        const isDarkTimeSegment = (hourValue >= 19 || hourValue <= 6); 
        canvasContext.beginPath();
        canvasContext.arc(0, 0, numberRingRadius, rotationalAngle - mathematicalPi / 24, rotationalAngle + mathematicalPi / 24);
        canvasContext.strokeStyle = isDarkTimeSegment ? '#1e1e1e' : '#f0f0f0';
        canvasContext.stroke();
      }
      canvasContext.restore();

      // Draw Hour Numbers
      canvasContext.font = `bold ${numberFontSize}px sans-serif`;
      canvasContext.textAlign = 'center';
      canvasContext.textBaseline = 'middle';
      for (let hourValue = 0; hourValue < 24; hourValue++) {
        const rotationalAngle = ((currentUniversalHour - hourValue) * mathematicalPi / 12) + halfPi;
        const isDarkTimeSegment = (hourValue >= 19 || hourValue <= 6);
        canvasContext.save();
        canvasContext.translate(numberRingRadius * Math.cos(rotationalAngle), numberRingRadius * Math.sin(rotationalAngle));
        canvasContext.rotate(rotationalAngle - halfPi); 
        canvasContext.fillStyle = isDarkTimeSegment ? '#ffffff' : '#222222';
        canvasContext.fillText(hourValue, 0, 0);
        canvasContext.restore();
      }

      // Draw City Names
      canvasContext.font = `600 ${cityFontSize}px sans-serif`;
      globalTimeZones.forEach((timeZoneData, arrayIndex) => {
        const rotationalAngle = halfPi - (timeZoneData.timeDifference * (mathematicalPi / 12));
        const staggerAmount = (arrayIndex % 2 === 0) ? 0 : (universalRadius * radiusMultipliers.cityLabelStagger);
        const radiusWithStagger = cityRingRadius + staggerAmount;

        canvasContext.save();
        canvasContext.translate(radiusWithStagger * Math.cos(rotationalAngle), radiusWithStagger * Math.sin(rotationalAngle));
        
        if (Math.sin(rotationalAngle) < 0) canvasContext.rotate(rotationalAngle + halfPi);
        else canvasContext.rotate(rotationalAngle - halfPi);
        
        canvasContext.fillStyle = '#222222';
        canvasContext.fillText(timeZoneData.cityName, 0, 0);
        canvasContext.restore();
      });
    }

    /* ==========================================================================
       5. DOM TEXT UPDATES
       ========================================================================== */
    function updateDigitalTextClocks() {
      const currentDate = new Date();
      
      const universalTimeHour = formatNumberWithLeadingZero(currentDate.getUTCHours());
      const universalTimeMinute = formatNumberWithLeadingZero(currentDate.getUTCMinutes());
      const universalTimeSecond = formatNumberWithLeadingZero(currentDate.getUTCSeconds());
      
      digitalClockElement.textContent = `UTC: ${universalTimeHour}:${universalTimeMinute}:${universalTimeSecond}`;

      const activeZoneData = globalTimeZones[currentZoneIndex];
      const timeDifference = activeZoneData.timeDifference;

      let localTimeHour = (currentDate.getUTCHours() + timeDifference) % 24;
      if (localTimeHour < 0) localTimeHour += 24;
      
      const formattedLocalHour = formatNumberWithLeadingZero(Math.floor(localTimeHour));
      const timeDifferenceString = formatTimeDifferenceText(timeDifference);
      
      localTimeDisplayElement.textContent = `${formattedLocalHour}:${universalTimeMinute}:${universalTimeSecond} — ${activeZoneData.cityName} (${timeDifferenceString})`;
    }

    /* ==========================================================================
       6. EVENT LISTENERS & INITIALIZATION
       ========================================================================== */
    function handleWindowResize() {
      // Increased from 0.85 to 0.935 (10% increase)
      const minimumScreenDimension = Math.min(window.innerWidth, window.innerHeight) * 0.935;
      const devicePixelScalingRatio = window.devicePixelRatio || 1;
      
      clockCanvasElement.style.width = minimumScreenDimension + "px";
      clockCanvasElement.style.height = minimumScreenDimension + "px";
      clockCanvasElement.width = minimumScreenDimension * devicePixelScalingRatio;
      clockCanvasElement.height = minimumScreenDimension * devicePixelScalingRatio;
      canvasContext.scale(devicePixelScalingRatio, devicePixelScalingRatio);

      renderClockFace();
    }

    increaseZoneButton.addEventListener('click', () => {
      currentZoneIndex = (currentZoneIndex + 1) % globalTimeZones.length;
      updateDigitalTextClocks();
    });

    decreaseZoneButton.addEventListener('click', () => {
      currentZoneIndex = (currentZoneIndex - 1 + globalTimeZones.length) % globalTimeZones.length;
      updateDigitalTextClocks();
    });

    timeZoneSliderElement.addEventListener('touchstart', touchEvent => {
      touchStartingXCoordinate = touchEvent.touches[0].clientX;
    }, {passive: false});

    timeZoneSliderElement.addEventListener('touchend', touchEvent => {
      const touchEndingXCoordinate = touchEvent.changedTouches[0].clientX;
      const horizontalDifference = touchEndingXCoordinate - touchStartingXCoordinate;
      
      if (Math.abs(horizontalDifference) > 50) {
        if (horizontalDifference > 0) currentZoneIndex = (currentZoneIndex - 1 + globalTimeZones.length) % globalTimeZones.length;
        else currentZoneIndex = (currentZoneIndex + 1) % globalTimeZones.length;
        updateDigitalTextClocks();
      }
    }, {passive: false});

    window.addEventListener('resize', handleWindowResize);
    window.addEventListener('orientationchange', handleWindowResize);

    // Start Clock
    handleWindowResize();
    setInterval(() => {
      renderClockFace();
      updateDigitalTextClocks();
    }, 1000);

  </script>
</body>
</html>
